name: ci

# Developer convenience only. The device never touches CI or a network at runtime.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests (unit + golden + property + screenshot regression)
        run: python -m pytest -q

      # Screenshot baselines are committed; a headless run compares against them.
      # The offline-install path (vendor/wheels) is validated during the OS image
      # build in Phase 5, not here, since the wheels are large binary artifacts.
